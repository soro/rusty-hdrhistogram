[package]
name = "hdrhistogram"
version = "0.1.0"
authors = [ "Soeren Roerden <soeren@roerden.de>" ]
license = "MIT"
readme = "README.md"
keywords = ["stats", "profiling", "metrics"]
description = "A Rust port of HdrHistogram"
repository = "https://github.org/soro/rusty-hdrhistogram.git"
categories = ["data-structures"]
edition = "2021"

[dependencies]
parking_lot = "0.12"
crossbeam-epoch = "0.9"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"], optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
clap = { version = "4.6.1", features = ["derive"], optional = true }

[features]
encoding-compression = ["dep:flate2"]
encoding-base64 = ["dep:base64", "dep:chrono", "encoding-compression"]
cli = ["dep:clap", "encoding-base64"]
loom-tests = []

[dev-dependencies]
criterion = "0.8.2"
loom = "0.7"
rand = "0.8"

[[bench]]
name = "record"
harness = false

[[bench]]
name = "encoding"
harness = false

[[bin]]
name = "hdrhistogram"
path = "src/bin/hdrhistogram.rs"
required-features = ["cli"]

[[test]]
name = "loom_phaser"
path = "tests/loom_phaser.rs"
required-features = ["loom-tests"]

[[test]]
name = "loom_recorder"
path = "tests/loom_recorder.rs"
required-features = ["loom-tests"]

[[test]]
name = "loom_resizable_read_view"
path = "tests/loom_resizable_read_view.rs"
required-features = ["loom-tests"]

[[test]]
name = "loom_concurrent_double_gate"
path = "tests/loom_concurrent_double_gate.rs"
required-features = ["loom-tests"]
